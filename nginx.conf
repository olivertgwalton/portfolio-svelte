server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# adapter-static writes /about as about.html and /blogs/foo as
	# blogs/foo.html, so extensionless URLs need the .html fallback.
	location / {
		try_files $uri $uri.html $uri/index.html =404;
	}

	# Hashed filenames — safe to cache forever.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# HTML is revalidated so a redeploy is picked up immediately.
	location ~* \.html$ {
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	# Prerendered OG cards change only when a post's title does.
	location /og/ {
		add_header Cache-Control "public, max-age=3600";
	}

	# Served with a real 404 status, not a soft 404 pointing at the homepage.
	error_page 404 /404.html;
	location = /404.html {
		internal;
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
